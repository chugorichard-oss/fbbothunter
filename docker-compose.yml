services:
  postgres:
    image: postgres:16-alpine
    container_name: bh-postgres
    restart: always
    environment:
      POSTGRES_DB: bot_hunter_db
      POSTGRES_USER: hunter_admin
      POSTGRES_PASSWORD: SecretHunterPassword2026!
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: bh-redis
    restart: always
    command: redis-server --appendonly yes --requirepass RedisHunterPassword2026!
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
